name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: dependency-review
    # The action requires GitHub's dependency graph. Opt in after enabling it in
    # the repository settings so this workflow does not fail unconditionally.
    if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
